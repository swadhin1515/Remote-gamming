apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: gamesessions.gamestream.example.com
spec:
  group: gamestream.example.com
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required:
                - username
                - room
              properties:
                username:
                  type: string
                  description: "Username for this game session"
                room:
                  type: string
                  description: "Room identifier for WebRTC connection"
                gameName:
                  type: string
                  description: "Name of the game to launch"
                  default: "snake.sh"
                captureMode:
                  type: string
                  description: "Video capture mode"
                  default: "container"
                  enum:
                    - container
                    - host
                signalingUrl:
                  type: string
                  description: "WebSocket URL for signaling server"
                  default: "ws://signaling-service:9000"
                sessionTimeout:
                  type: integer
                  description: "Session timeout in minutes (0 = no timeout)"
                  default: 30
                  minimum: 0
                resources:
                  type: object
                  description: "Resource limits and requests"
                  properties:
                    limits:
                      type: object
                      properties:
                        cpu:
                          type: string
                          default: "2.0"
                        memory:
                          type: string
                          default: "4Gi"
                    requests:
                      type: object
                      properties:
                        cpu:
                          type: string
                          default: "1.0"
                        memory:
                          type: string
                          default: "2Gi"
            status:
              type: object
              properties:
                phase:
                  type: string
                  description: "Current phase of the game session"
                  enum:
                    - Pending
                    - Running
                    - Terminating
                    - Failed
                podName:
                  type: string
                  description: "Name of the pod running this session"
                serviceName:
                  type: string
                  description: "Name of the service for this session"
                startTime:
                  type: string
                  format: date-time
                  description: "When the session started"
                expiryTime:
                  type: string
                  format: date-time
                  description: "When the session will expire"
                message:
                  type: string
                  description: "Human-readable status message"
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Username
          type: string
          jsonPath: .spec.username
        - name: Room
          type: string
          jsonPath: .spec.room
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Pod
          type: string
          jsonPath: .status.podName
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
  scope: Namespaced
  names:
    plural: gamesessions
    singular: gamesession
    kind: GameSession
    shortNames:
      - gs
