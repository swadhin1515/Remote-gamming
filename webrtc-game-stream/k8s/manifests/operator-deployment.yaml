apiVersion: v1
kind: ServiceAccount
metadata:
  name: game-operator
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: game-operator-role
rules:
  # Permissions for GameSession CRD
  - apiGroups: ["gamestream.example.com"]
    resources: ["gamesessions"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["gamestream.example.com"]
    resources: ["gamesessions/status"]
    verbs: ["get", "update", "patch"]
  
  # Permissions for Pods
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  
  # Permissions for Services
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  
  # Permissions for ConfigMaps (if needed for game configs)
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  
  # Permissions for Events (for logging)
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
  
  # Permissions to read namespaces
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: game-operator-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: game-operator-role
subjects:
  - kind: ServiceAccount
    name: game-operator
    namespace: default
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: game-operator
  namespace: default
  labels:
    app: game-operator
    component: operator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: game-operator
  template:
    metadata:
      labels:
        app: game-operator
        component: operator
    spec:
      serviceAccountName: game-operator
      containers:
      - name: operator
        image: game-operator:latest
        imagePullPolicy: IfNotPresent
        env:
        - name: OPERATOR_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: GAME_IMAGE
          value: "game:latest"
        - name: SIGNALING_SERVICE
          value: "signaling-service:9000"
        resources:
          limits:
            cpu: "1.0"
            memory: "512Mi"
          requests:
            cpu: "0.5"
            memory: "256Mi"
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 20
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
      restartPolicy: Always
