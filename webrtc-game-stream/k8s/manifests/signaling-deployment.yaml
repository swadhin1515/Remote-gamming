apiVersion: apps/v1
kind: Deployment
metadata:
  name: signaling-server
  labels:
    app: signaling-server
    component: signaling
spec:
  replicas: 1
  selector:
    matchLabels:
      app: signaling-server
  template:
    metadata:
      labels:
        app: signaling-server
        component: signaling
    spec:
      containers:
      - name: signaling
        image: signaling:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 9000
          name: websocket
          protocol: TCP
        env:
        - name: PORT
          value: "9000"
        - name: NODE_ENV
          value: "production"
        resources:
          limits:
            cpu: "1.0"
            memory: "1Gi"
          requests:
            cpu: "0.5"
            memory: "512Mi"
        livenessProbe:
          tcpSocket:
            port: 9000
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          tcpSocket:
            port: 9000
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
      restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  name: signaling-service
  labels:
    app: signaling-server
    component: signaling
spec:
  type: ClusterIP
  selector:
    app: signaling-server
  ports:
  - name: websocket
    port: 9000
    targetPort: 9000
    protocol: TCP
  sessionAffinity: None
