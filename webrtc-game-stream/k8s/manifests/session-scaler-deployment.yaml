apiVersion: v1
kind: ServiceAccount
metadata:
  name: session-scaler
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: session-scaler-role
rules:
  # Permissions for Deployments
  - apiGroups: ["apps"]
    resources: ["deployments", "deployments/scale"]
    verbs: ["get", "list", "watch", "update", "patch"]
  
  # Permissions for Pods (read-only for monitoring)
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  
  # Permissions for Events (for logging)
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: session-scaler-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: session-scaler-role
subjects:
  - kind: ServiceAccount
    name: session-scaler
    namespace: default
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: session-scaler
  namespace: default
  labels:
    app: session-scaler
    component: scaler
spec:
  replicas: 1
  selector:
    matchLabels:
      app: session-scaler
  template:
    metadata:
      labels:
        app: session-scaler
        component: scaler
    spec:
      serviceAccountName: session-scaler
      containers:
      - name: session-scaler
        image: session-scaler:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 8080
          name: websocket
          protocol: TCP
        env:
        - name: LISTEN_PORT
          value: "8080"
        - name: NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: DEPLOYMENT_NAME
          value: "game-sessions"
        - name: BASE_ROOM_PREFIX
          value: "room-dockerstream1.fyre.ibm.com"
        resources:
          limits:
            cpu: "0.3"
            memory: "256Mi"
          requests:
            cpu: "0.1"
            memory: "128Mi"
        # Probes disabled - WebSocket server rejects non-WS connections
        # livenessProbe:
        #   tcpSocket:
        #     port: 8080
        #   initialDelaySeconds: 10
        #   periodSeconds: 10
        # readinessProbe:
        #   tcpSocket:
        #     port: 8080
        #   initialDelaySeconds: 5
        #   periodSeconds: 5
      restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  name: session-scaler-service
  namespace: default
  labels:
    app: session-scaler
    component: scaler
spec:
  type: NodePort
  selector:
    app: session-scaler
  ports:
  - name: websocket
    port: 8080
    targetPort: 8080
    nodePort: 30086
    protocol: TCP
