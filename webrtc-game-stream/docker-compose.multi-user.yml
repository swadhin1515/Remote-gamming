version: '3.8'

services:
  signaling:
    build: ./signaling
    container_name: signaling-server
    ports:
      - "9000:9000"
    networks:
      - game-network
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  game-1:
    build: ./game
    container_name: game-instance-1
    depends_on:
      - signaling
    environment:
      - SIGNALING_URL=ws://signaling-server:9000
      - ROOM=room-dockerstream1.fyre.ibm.com-1
      - DISPLAY=:99
      - GAME_CMD=xterm -maximized -e /app/game_launcher.sh
      - GAME_NAME=${GAME_NAME:-snake.sh}
      - CAPTURE_MODE=${CAPTURE_MODE:-container}
    privileged: true
    devices:
      - /dev/uinput:/dev/uinput
    volumes:
      - ./games:/games:ro
    networks:
      - game-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G
        reservations:
          cpus: '1.0'
          memory: 2G
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  game-2:
    build: ./game
    container_name: game-instance-2
    depends_on:
      - signaling
    environment:
      - SIGNALING_URL=ws://signaling-server:9000
      - ROOM=room-dockerstream1.fyre.ibm.com-2
      - DISPLAY=:99
      - GAME_CMD=xterm -maximized -e /app/game_launcher.sh
      - GAME_NAME=${GAME_NAME:-snake.sh}
      - CAPTURE_MODE=${CAPTURE_MODE:-container}
    privileged: true
    devices:
      - /dev/uinput:/dev/uinput
    volumes:
      - ./games:/games:ro
    networks:
      - game-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G
        reservations:
          cpus: '1.0'
          memory: 2G
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  game-3:
    build: ./game
    container_name: game-instance-3
    depends_on:
      - signaling
    environment:
      - SIGNALING_URL=ws://signaling-server:9000
      - ROOM=room-dockerstream1.fyre.ibm.com-3
      - DISPLAY=:99
      - GAME_CMD=xterm -maximized -e /app/game_launcher.sh
      - GAME_NAME=${GAME_NAME:-snake.sh}
      - CAPTURE_MODE=${CAPTURE_MODE:-container}
    privileged: true
    devices:
      - /dev/uinput:/dev/uinput
    volumes:
      - ./games:/games:ro
    networks:
      - game-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G
        reservations:
          cpus: '1.0'
          memory: 2G
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  web:
    build: ./web
    container_name: web-server
    depends_on:
      - signaling
    ports:
      - "8085:80"
    networks:
      - game-network
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  game-network:
    driver: bridge

# Usage:
#
# Start all 3 game instances:
#   docker compose -f docker-compose.multi-user.yml up -d
#
# Start specific game instance:
#   docker compose -f docker-compose.multi-user.yml up -d game-1
#   docker compose -f docker-compose.multi-user.yml up -d game-2
#   docker compose -f docker-compose.multi-user.yml up -d game-3
#
# Access via web browser:
#   http://dockerstream1.fyre.ibm.com:8085
#   Select which game server (1, 2, or 3) you want to connect to
